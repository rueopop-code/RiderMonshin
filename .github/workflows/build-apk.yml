name: Build Rider APK

on:
  push:
    branches: [main]
    paths:
      - "www/**"
      - "resources/**"
      - "capacitor.config.json"
      - "package.json"
      - "android/**"
      - "android-manifest-additions.xml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install

      - name: Add Android platform (first run only)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Generate app icon & splash from resources/
        run: |
          npm install @capacitor/assets --save-dev
          npx capacitor-assets generate --android

      - name: Sync Capacitor
        run: npx cap sync android

      # android/ is regenerated from scratch every build (it's not committed to
      # the repo), so android-manifest-additions.xml's permissions were never
      # actually reaching the built APK — background GPS + camera silently had
      # no permissions declared. This step injects them every time, right
      # after the opening <manifest> tag. Idempotent (skips if already present).
      # Each permission is its own single-line sed command on purpose — keeps
      # this step simple plain-text YAML with no embedded multi-line blocks.
      - name: Inject required Android permissions into the manifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ ! -f "$MANIFEST" ]; then
            echo "AndroidManifest.xml not found at $MANIFEST" && exit 1
          fi
          if grep -q "ACCESS_BACKGROUND_LOCATION" "$MANIFEST"; then
            echo "Permissions already present, skipping."
          else
            sed -i '/<manifest /a\    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"
            sed -i '/<manifest /a\    <uses-permission android:name="android.permission.CAMERA" />' "$MANIFEST"
            sed -i '/<manifest /a\    <uses-permission android:name="android.permission.WAKE_LOCK" />' "$MANIFEST"
            sed -i '/<manifest /a\    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />' "$MANIFEST"
            sed -i '/<manifest /a\    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />' "$MANIFEST"
            sed -i '/<manifest /a\    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />' "$MANIFEST"
            sed -i '/<manifest /a\    <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />' "$MANIFEST"
            sed -i '/<manifest /a\    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' "$MANIFEST"
            sed -i '/<manifest /a\    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />' "$MANIFEST"
          fi
          echo "----- Resulting manifest permissions -----"
          grep "uses-permission" "$MANIFEST"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: monshin-rider-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  # Release build (signed) — enable once you have a keystore.
  # Store keystore as base64 in repo secret RIDER_KEYSTORE_B64,
  # and password/alias in RIDER_KEYSTORE_PASSWORD / RIDER_KEY_ALIAS.
  # build-release:
  #   runs-on: ubuntu-latest
  #   needs: build
  #   steps: [...]
