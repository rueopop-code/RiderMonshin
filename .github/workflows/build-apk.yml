name: Build Rider APK

on:
  push:
    branches: [main]
    paths:
      - "www/**"
      - "resources/**"
      - "capacitor.config.json"
      - "package.json"
      - "android/**"
      - "android-manifest-additions.xml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install

      - name: Add Android platform (first run only)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Generate app icon & splash from resources/
        run: |
          npm install @capacitor/assets --save-dev
          npx capacitor-assets generate --android

      - name: Sync Capacitor
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: monshin-rider-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  # Release build (signed) — enable once you have a keystore.
  # Store keystore as base64 in repo secret RIDER_KEYSTORE_B64,
  # and password/alias in RIDER_KEYSTORE_PASSWORD / RIDER_KEY_ALIAS.
  # build-release:
  #   runs-on: ubuntu-latest
  #   needs: build
  #   steps: [...]
