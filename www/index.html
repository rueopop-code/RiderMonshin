<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Monshin Rider</title>
<link rel="icon" type="image/png" href="logo.png" />
<style>
  :root {
    --bg: #1a0a0a;
    --card: #2a1010;
    --card-2: #341414;
    --accent: #dc2626;
    --accent-dim: #7f1d1d;
    --text: #fdf2f2;
    --muted: #c98f8f;
    --muted-2: #8f6060;
    --ok: #16a34a;
    --warn: #d97706;
    --line: #4a1f1f;
    --tabbar-h: 64px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, "Noto Sans Thai", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .screen { display: none; min-height: 100vh; }
  .screen.active { display: block; }

  /* ---------- login ---------- */
  #loginScreen.active {
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .card {
    width: 100%; max-width: 360px; background: var(--card);
    border-radius: 16px; padding: 32px 24px; box-shadow: 0 10px 30px rgba(0,0,0,.3);
  }
  .logo-wrap { text-align: center; margin-bottom: 18px; }
  .logo-wrap img { width: 76px; height: 76px; border-radius: 50%; object-fit: cover; border: 3px solid var(--accent); }
  h1 { font-size: 20px; margin: 0 0 4px; text-align: center; }
  p.sub { color: var(--muted); font-size: 13px; text-align: center; margin: 0 0 28px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  input, textarea {
    width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line);
    background: #1a0a0a; color: var(--text); font-size: 15px; margin-bottom: 16px;
  }
  input:focus, textarea:focus { outline: 2px solid var(--accent); }
  button {
    width: 100%; padding: 13px; border: none; border-radius: 10px;
    background: var(--accent); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
    font-family: inherit;
  }
  button:active { opacity: .85; }
  button.secondary { background: transparent; border: 1px solid var(--line); }
  button.ok { background: var(--ok); }
  button.warn { background: var(--warn); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .line-btn { background: #06c755; margin-top: 10px; }
  .divider { text-align: center; color: var(--muted); font-size: 12px; margin: 16px 0; }
  #loginStatus { margin-top: 14px; font-size: 13px; text-align: center; min-height: 18px; }

  /* ---------- main app shell ---------- */
  #appScreen.active { display: flex; flex-direction: column; }
  .topbar {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 14px 18px; background: var(--card);
    border-bottom: 1px solid var(--line);
  }
  .topbar .who { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .avatar-circle {
    width: 38px; height: 38px; border-radius: 50%; background: var(--accent-dim);
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px;
    flex-shrink: 0; border: 1px solid var(--accent); overflow: hidden;
  }
  .avatar-circle img { width: 100%; height: 100%; object-fit: cover; }
  .who-text { min-width: 0; }
  .who-text .greeting { font-size: 11px; color: var(--muted); line-height: 1.3; }
  .who-text .name { font-size: 15px; font-weight: 600; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .topbar-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .icon-btn {
    width: 38px; height: 38px; border-radius: 10px; background: var(--card-2);
    border: 1px solid var(--line); display: flex; align-items: center; justify-content: center;
    color: var(--text); cursor: pointer; padding: 0;
  }
  .icon-btn svg { width: 19px; height: 19px; }
  .icon-btn.spinning svg { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .tab-panel { display: none; padding: 16px 16px calc(var(--tabbar-h) + 24px); flex: 1; }
  .tab-panel.active { display: block; }

  /* ---------- orders tab ---------- */
  .section-title { font-size: 13px; color: var(--muted); margin: 4px 2px 12px; font-weight: 600; letter-spacing: .3px; }
  .job-list { display: flex; flex-direction: column; gap: 12px; }
  .job-card {
    background: var(--card); border-radius: 14px; padding: 16px;
    border: 1px solid var(--line); position: relative; overflow: hidden;
  }
  .job-card::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--accent);
  }
  .job-card .badge {
    display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600;
    padding: 4px 10px; border-radius: 999px; background: var(--accent-dim); color: #ffd7d7; margin-bottom: 10px;
  }
  .job-card .cust { font-weight: 700; font-size: 15px; margin-bottom: 4px; }
  .job-card .addr { color: var(--muted); font-size: 13px; margin-bottom: 4px; display: flex; gap: 6px; align-items: flex-start; }
  .job-card .addr svg { flex-shrink: 0; margin-top: 2px; width: 14px; height: 14px; opacity: .7; }
  .job-card .cod-line { color: var(--warn); font-size: 13px; font-weight: 600; margin-top: 6px; }
  .job-card .actions { display: flex; gap: 8px; margin-top: 14px; }
  .job-card .actions button { flex: 1; }

  .empty-state { text-align: center; color: var(--muted); padding: 70px 20px 20px; font-size: 14px; line-height: 1.7; }
  .empty-state svg { width: 44px; height: 44px; opacity: .35; margin-bottom: 14px; }

  .spinner-center { display: flex; justify-content: center; padding: 40px 0; }
  .spinner {
    width: 26px; height: 26px; border-radius: 50%; border: 3px solid var(--line);
    border-top-color: var(--accent); animation: spin .8s linear infinite;
  }

  /* ---------- history tab ---------- */
  .history-item {
    background: var(--card); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px;
    border: 1px solid var(--line); display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;
  }
  .history-item .left { min-width: 0; flex: 1; }
  .history-item .cust { font-weight: 600; font-size: 14px; margin-bottom: 3px; }
  .history-item .addr { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  .history-item .date { color: var(--muted-2); font-size: 11px; }
  .history-item .right { text-align: right; flex-shrink: 0; }
  .status-pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
  .status-pill.done { background: rgba(22,163,74,.18); color: #4ade80; }
  .status-pill.failed { background: rgba(217,119,6,.18); color: #fbbf24; }
  .history-item .cod { font-size: 12px; color: var(--warn); margin-top: 6px; font-weight: 600; }

  /* ---------- account tab ---------- */
  .profile-card {
    background: linear-gradient(135deg, var(--card) 0%, var(--card-2) 100%);
    border: 1px solid var(--line); border-radius: 16px; padding: 24px 20px; text-align: center; margin-bottom: 16px;
  }
  .avatar-big-wrap { position: relative; width: 68px; margin: 0 auto 12px; }
  .avatar-big {
    width: 68px; height: 68px; border-radius: 50%; background: var(--accent-dim);
    border: 2px solid var(--accent); display: flex; align-items: center; justify-content: center;
    font-size: 26px; font-weight: 700; overflow: hidden;
  }
  .avatar-big img { width: 100%; height: 100%; object-fit: cover; }
  .avatar-edit-btn {
    position: absolute; right: -2px; bottom: -2px; width: 26px; height: 26px; border-radius: 50%;
    background: var(--accent); border: 2px solid var(--card); display: flex; align-items: center;
    justify-content: center; cursor: pointer;
  }
  .avatar-edit-btn svg { width: 13px; height: 13px; color: #fff; }
  .avatar-edit-btn.uploading svg { animation: spin .8s linear infinite; }
  .profile-card .pname { font-size: 17px; font-weight: 700; margin-bottom: 3px; }
  .profile-card .pcode { font-size: 13px; color: var(--muted); }
  #photoUploadStatus { font-size: 12px; color: var(--muted); margin-top: 8px; min-height: 16px; }

  .stat-row { display: flex; gap: 10px; margin-bottom: 16px; }
  .stat-box { flex: 1; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; text-align: center; }
  .stat-box .num { font-size: 20px; font-weight: 700; color: var(--accent); }
  .stat-box .lbl { font-size: 11px; color: var(--muted); margin-top: 4px; }

  .menu-list { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-bottom: 16px; }
  .menu-row { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); font-size: 14px; cursor: pointer; }
  .menu-row:last-child { border-bottom: none; }
  .menu-row svg { width: 18px; height: 18px; color: var(--muted); flex-shrink: 0; }
  .menu-row span { flex: 1; }
  .menu-row .chev { color: var(--muted-2); }

  #logoutBtn2 { background: transparent; border: 1px solid var(--line); color: #f87171; }

  /* ---------- bottom tab bar ---------- */
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; height: var(--tabbar-h); z-index: 30;
    background: var(--card); border-top: 1px solid var(--line);
    display: flex; padding-bottom: env(safe-area-inset-bottom, 0);
  }
  .tabbar-btn {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px; background: none; border: none; color: var(--muted-2); font-size: 11px;
    padding: 6px 0; cursor: pointer; font-family: inherit;
  }
  .tabbar-btn svg { width: 21px; height: 21px; }
  .tabbar-btn.active { color: var(--accent); }

  /* ---------- complete-delivery modal ---------- */
  .modal-backdrop {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6);
    align-items: flex-end; justify-content: center; z-index: 50;
  }
  .modal-backdrop.active { display: flex; }
  .modal-sheet {
    background: var(--card); width: 100%; max-width: 420px; border-radius: 16px 16px 0 0;
    padding: 20px; max-height: 85vh; overflow-y: auto;
  }
  .modal-sheet h3 { margin: 0 0 16px; }
  .fail-reasons { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .fail-reasons button { width: auto; flex: 1 1 45%; font-size: 13px; padding: 10px; background: transparent; border: 1px solid var(--line); }
  .fail-reasons button.selected { background: var(--warn); border-color: var(--warn); }
  #photoPreview { width: 100%; border-radius: 10px; margin-bottom: 12px; display: none; }
  .download-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--line);
    background: transparent; color: var(--text); font-size: 14px; text-decoration: none; margin-top: 10px;
  }
</style>
</head>
<body>

  <!-- ================= LOGIN SCREEN ================= -->
  <div id="loginScreen" class="screen active">
    <div class="card">
      <div class="logo-wrap"><img src="logo.png" alt="Monshin Supply" /></div>
      <h1>Monshin Rider</h1>
      <p class="sub">เข้าสู่ระบบสำหรับไรเดอร์</p>

      <label for="code">รหัสพนักงาน</label>
      <input id="code" type="text" placeholder="เช่น RD001" autocomplete="off" />

      <label for="pw">รหัสผ่าน</label>
      <input id="pw" type="password" placeholder="••••••••" autocomplete="off" />

      <button id="loginBtn" type="button">เข้าสู่ระบบ</button>
      <div class="divider">หรือ</div>
      <button id="lineLoginBtn" class="line-btn" type="button">เข้าสู่ระบบด้วย LINE</button>

      <a id="downloadBtn" class="download-btn" href="https://github.com/rueopop-code/RiderMonshin/actions" target="_blank" rel="noopener">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        ดาวน์โหลดแอพไรเดอร์ (APK)
      </a>

      <div id="loginStatus"></div>
    </div>
  </div>

  <!-- ================= MAIN APP SCREEN ================= -->
  <div id="appScreen" class="screen">
    <div class="topbar">
      <div class="who">
        <div class="avatar-circle" id="avatarInitial">?</div>
        <div class="who-text">
          <div class="greeting">สวัสดี</div>
          <div class="name" id="riderNameLabel">-</div>
        </div>
      </div>
      <div class="topbar-actions">
        <button id="refreshBtn" class="icon-btn" type="button" title="รีเฟรช">

        </button>
      </div>

    <!-- ---- ORDERS TAB ---- -->
    <div id="tabOrders" class="tab-panel active">
      <div class="section-title">งานที่ได้รับมอบหมาย</div>
      <div id="jobList" class="job-list">

      </div>

    <!-- ---- HISTORY TAB ---- -->

      <div class="section-title">ประวัติการส่งของ</div>
      <div id="historyList">
        <div class="spinner-center"><div class="spinner"></div></div>
      </div>
    </div>

    <!-- ---- ACCOUNT TAB ---- -->
    <div id="tabAccount" class="tab-panel">
      <div class="profile-card">
        <div class="avatar-big-wrap">
          <div class="avatar-big" id="avatarInitialBig">?</div>
          <div class="avatar-edit-btn" id="avatarEditBtn" title="เปลี่ยนรูปโปรไฟล์">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
          </div>
          <input id="avatarFileInput" type="file" accept="image/*" style="display:none" />
        </div>
        <div class="pname" id="accNameLabel">-</div>
        <div class="pcode" id="accCodeLabel">-</div>

      </div>

      <div class="stat-row">
        <div class="stat-box">
          <div class="num" id="codTotalLabel">–</div>

          <span>รีเฟรชข้อมูล</span>
          <span class="chev">›</span>
        </div>
      </div>

      <button id="logoutBtn2" type="button">ออกจากระบบ</button>
    </div>

    <!-- ---- BOTTOM TAB BAR ---- -->
    <div class="tabbar">
      <button class="tabbar-btn active" data-tab="tabOrders" type="button">

        <span>ออเดอร์</span>
      </button>
      <button class="tabbar-btn" data-tab="tabHistory" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/></svg>
        <span>ประวัติ</span>
      </button>
      <button class="tabbar-btn" data-tab="tabAccount" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>

  <!-- ================= COMPLETE DELIVERY MODAL ================= -->
  <div id="completeModal" class="modal-backdrop">
    <div class="modal-sheet">
      <h3>ยืนยันการส่งของ</h3>

      <label>ถ่ายรูปยืนยัน (ก่อนถึงมือลูกค้า)</label>
      <input id="photoInput" type="file" accept="image/*" capture="environment" />
      <img id="photoPreview" />

      <label for="codInput">จำนวนเงินที่เก็บ (บาท)</label>
      <input id="codInput" type="number" inputmode="decimal" placeholder="0" />

      <button id="confirmCompleteBtn" class="ok" type="button">ยืนยันส่งสำเร็จ</button>

      <div class="divider">หรือ</div>

      <label>ส่งไม่สำเร็จ — เลือกเหตุผล</label>
      <div class="fail-reasons">
        <button data-reason="no_answer" type="button">ลูกค้าไม่รับสาย</button>
        <button data-reason="not_home" type="button">ไม่อยู่บ้าน</button>
        <button data-reason="refused" type="button">ปฏิเสธรับของ</button>
        <button data-reason="wrong_address" type="button">ที่อยู่ผิด</button>
      </div>
      <button id="confirmFailBtn" class="warn" type="button">ยืนยันส่งไม่สำเร็จ</button>

      <button id="cancelModalBtn" class="secondary" type="button" style="margin-top:10px;">ยกเลิก</button>
    </div>
  </div>

  <script src="rider-location.js"></script>
  <script>
    // ============================================================
    // CONFIG
    // ============================================================
    const GAS_ENDPOINT = "https://script.google.com/macros/s/AKfycbyevPmMs9FV72XrEOep5cshnQUBZ0vWZFqr0DW4N7XKJNC47PIQuF6XefX2FICCa6ig/exec";
    const SUPABASE_URL = "https://ckfzscprxighfxztmgct.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNrZnpzY3ByeGlnaGZ4enRtZ2N0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwNTU0NDIsImV4cCI6MjA5MjYzMTQ0Mn0.nQ_LhPz9GsehqRSNx67G5cqxCKHD-cM1gbs2edTqUpw";

    // ============================================================
    // LOGGING — goes to DevTools console only, nothing shown on screen
    // ============================================================
    function debugLog(...args) {
      console.log(...args);
    }

    // ============================================================
    // STATE
    // ============================================================
    let session = null;
    let selectedReason = null;
    let activeJobId = null;
    let pollInterval = null;
    let activeTab = "tabOrders";

    // ============================================================
    // API HELPER — single attempt, always logs what happened
    // ============================================================
    async function callGas(action, params = {}) {
      debugLog("→ callGas", action, params);
      try {
        const res = await fetch(GAS_ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "text/plain" }, // avoids CORS preflight on GAS
          body: JSON.stringify({ action, ...params })
        });
        debugLog("← http status", res.status);
        const text = await res.text();
        let json;
        try {
          json = JSON.parse(text);
        } catch (parseErr) {
          debugLog("✗ JSON parse failed. Raw response:", text.slice(0, 300));
          return { ok: false, error: "bad_response" };
        }
        debugLog("← result", json);
        return json;
      } catch (err) {
        debugLog("✗ fetch threw:", err.message || String(err));
        return { ok: false, error: "network_error" };
      }
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    // downscale + compress an image before upload (keeps profile photo uploads fast/small)
    function resizeImage(file, maxSize = 640, quality = 0.85) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const reader = new FileReader();
        reader.onload = () => { img.src = reader.result; };
        reader.onerror = reject;
        img.onload = () => {
          let { width, height } = img;
          if (width > height && width > maxSize) { height = Math.round(height * maxSize / width); width = maxSize; }
          else if (height > maxSize) { width = Math.round(width * maxSize / height); height = maxSize; }
          const canvas = document.createElement("canvas");
          canvas.width = width; canvas.height = height;
          canvas.getContext("2d").drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL("image/jpeg", quality));
        };
        img.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    // ============================================================
    // SESSION persistence
    // ============================================================
    function saveSession(s) {
      session = s;
      try { localStorage.setItem("rider_session", JSON.stringify(s)); } catch (e) {}
    }
    function loadSession() {
      try {
        const raw = localStorage.getItem("rider_session");
        if (raw) session = JSON.parse(raw);
      } catch (e) {}
      return session;
    }
    function clearSession() {
      session = null;
      try { localStorage.removeItem("rider_session"); } catch (e) {}
    }

    // ============================================================
    // SCREEN SWITCHING
    // ============================================================
    function showScreen(id) {
      document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
      document.getElementById(id).classList.add("active");
    }

    // ============================================================
    // LOGIN
    // ============================================================
    const loginStatus = document.getElementById("loginStatus");
    const loginBtn = document.getElementById("loginBtn");

    async function doLogin() {
      const code = document.getElementById("code").value.trim();
      const pw = document.getElementById("pw").value;
      if (!code || !pw) { loginStatus.textContent = "กรอกรหัสพนักงานและรหัสผ่าน"; return; }

      loginBtn.disabled = true;
      loginStatus.textContent = "กำลังเข้าสู่ระบบ...";

      const result = await callGas("login", { code, password: pw });

      loginBtn.disabled = false;

      if (!result.ok) {
        const messages = {
          not_found: "ไม่พบรหัสพนักงานนี้",
          not_active: "บัญชียังไม่เปิดใช้งาน",
          wrong_password: "รหัสผ่านไม่ถูกต้อง",
          bad_response: "เซิร์ฟเวอร์ตอบข้อมูลไม่ถูกต้อง ลองใหม่",
          network_error: "เชื่อมต่อไม่ได้ ลองใหม่อีกครั้ง"
        };
        loginStatus.textContent = messages[result.error] || ("เข้าสู่ระบบไม่สำเร็จ: " + result.error);
        return;
      }

      loginStatus.textContent = "";
      saveSession(result.data);
      enterApp();
    }

    loginBtn.addEventListener("click", doLogin);
    document.getElementById("code").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
    document.getElementById("pw").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });

    document.getElementById("lineLoginBtn").addEventListener("click", () => {
      loginStatus.textContent = "LINE Login ยังไม่ได้ตั้งค่า LIFF สำหรับหน้านี้";
    });

    // ============================================================
    // ENTER APP / LOGOUT
    // ============================================================
    function initials(name) {
      if (!name) return "?";
      const parts = String(name).trim().split(/\s+/);
      return (parts[0][0] || "?").toUpperCase();
    }

    function renderAvatars() {
      const small = document.getElementById("avatarInitial");
      const big = document.getElementById("avatarInitialBig");
      if (session && session.photoUrl) {
        small.innerHTML = '<img src="' + session.photoUrl + '" alt="" />';
        big.innerHTML = '<img src="' + session.photoUrl + '" alt="" />';
      } else {
        const ini = initials(session ? session.name : "");
        small.textContent = ini;
        big.textContent = ini;
      }
    }

    function enterApp() {
      document.getElementById("riderNameLabel").textContent = session.name;
      document.getElementById("accNameLabel").textContent = session.name;
      document.getElementById("accCodeLabel").textContent = "รหัสพนักงาน: " + session.code;
      renderAvatars();

      showScreen("appScreen");
      switchTab("tabOrders");

      clearInterval(pollInterval);
      pollInterval = setInterval(loadJobs, 15000);
    }

    function doLogout() {
      clearInterval(pollInterval);
      if (window.RiderLocation) RiderLocation.stop();
      clearSession();
      showScreen("loginScreen");
    }
    document.getElementById("logoutBtn2").addEventListener("click", doLogout);

    // ============================================================
    // TAB SWITCHING
    // ============================================================
    function switchTab(tabId) {
      activeTab = tabId;
      document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
      document.getElementById(tabId).classList.add("active");
      document.querySelectorAll(".tabbar-btn").forEach(b => {
        b.classList.toggle("active", b.dataset.tab === tabId);
      });

      if (tabId === "tabOrders") loadJobs();
      if (tabId === "tabHistory") loadHistory();
      if (tabId === "tabAccount") loadAccountStats();
    }

    document.querySelectorAll(".tabbar-btn").forEach(btn => {
      btn.addEventListener("click", () => switchTab(btn.dataset.tab));
    });

    document.getElementById("refreshAccountRow").addEventListener("click", () => refreshCurrentTab());
    document.getElementById("downloadApkRow").addEventListener("click", () => {
      window.open("https://github.com/rueopop-code/RiderMonshin/actions", "_blank");
    });

    // ============================================================
    // MANUAL REFRESH BUTTON (top bar)
    // ============================================================
    const refreshBtn = document.getElementById("refreshBtn");
    async function refreshCurrentTab() {
      refreshBtn.classList.add("spinning");
      if (activeTab === "tabOrders") await loadJobs();
      else if (activeTab === "tabHistory") await loadHistory();
      else if (activeTab === "tabAccount") await loadAccountStats();
      setTimeout(() => refreshBtn.classList.remove("spinning"), 300);
    }
    refreshBtn.addEventListener("click", refreshCurrentTab);

    // ============================================================
    // PROFILE PHOTO UPLOAD
    // ============================================================
    const avatarFileInput = document.getElementById("avatarFileInput");
    const avatarEditBtn = document.getElementById("avatarEditBtn");
    const photoUploadStatus = document.getElementById("photoUploadStatus");

    avatarEditBtn.addEventListener("click", () => avatarFileInput.click());

    avatarFileInput.addEventListener("change", async () => {
      const file = avatarFileInput.files[0];
      if (!file || !session) return;

      avatarEditBtn.classList.add("uploading");
      photoUploadStatus.textContent = "กำลังอัปโหลดรูป...";

      try {
        const resized = await resizeImage(file);
        const result = await callGas("updatePhoto", { riderId: session.riderId, photoBase64: resized });

        if (result.ok && result.data && result.data.photoUrl) {
          session.photoUrl = result.data.photoUrl;
          saveSession(session);
          renderAvatars();
          photoUploadStatus.textContent = "อัปเดตรูปโปรไฟล์แล้ว";
          setTimeout(() => { photoUploadStatus.textContent = ""; }, 2500);
        } else {
          photoUploadStatus.textContent = "อัปโหลดไม่สำเร็จ ลองใหม่อีกครั้ง";
        }
      } catch (err) {
        debugLog("photo upload error", err);
        photoUploadStatus.textContent = "อัปโหลดไม่สำเร็จ ลองใหม่อีกครั้ง";
      }

      avatarEditBtn.classList.remove("uploading");
      avatarFileInput.value = "";
    });

    // ============================================================
    // ORDERS TAB
    // ============================================================
    async function loadJobs() {
      if (!session) return;
      const result = await callGas("poll", { riderId: session.riderId });
      if (!result.ok || !Array.isArray(result.data)) {
        debugLog("poll failed or returned bad data", result);
        return;
      }
      renderJobs(result.data);
    }

    function renderJobs(jobs) {
      const listEl = document.getElementById("jobList");
      if (!jobs.length) {
        listEl.innerHTML = '<div class="empty-state">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>' +
          '<div>ยังไม่มีงานตอนนี้<br>รอการแจ้งเตือนงานใหม่</div></div>';
        return;
      }
      listEl.innerHTML = jobs.map(renderJobCard).join("");
      jobs.forEach(job => {
        const accept = document.getElementById("accept-" + job.id);
        const depart = document.getElementById("depart-" + job.id);
        const arrive = document.getElementById("arrive-" + job.id);
        const deliver = document.getElementById("deliver-" + job.id);
        if (accept) accept.addEventListener("click", () => acceptJob(job.id));
        if (depart) depart.addEventListener("click", () => departJob(job.id));
        if (arrive) arrive.addEventListener("click", () => arriveJob(job.id));
        if (deliver) deliver.addEventListener("click", () => openCompleteModal(job.id));
      });
    }

    function renderJobCard(job) {
      const statusLabels = {
        offered: "งานใหม่", accepted: "รับงานแล้ว", departed: "กำลังเดินทาง", arrived: "ถึงที่หมายแล้ว"
      };
      let actionsHtml = "";
      if (job.status === "offered") {
        actionsHtml = '<button id="accept-' + job.id + '" type="button">รับงาน</button>';
      } else if (job.status === "accepted") {
        actionsHtml = '<button id="depart-' + job.id + '" type="button">พร้อมออกเดินทาง</button>';
      } else if (job.status === "departed") {
        actionsHtml = '<button id="arrive-' + job.id + '" type="button">ถึงที่หมายแล้ว</button>';
      } else if (job.status === "arrived") {
        actionsHtml = '<button id="deliver-' + job.id + '" class="ok" type="button">ส่งของ</button>';
      }
      return '<div class="job-card">' +
        '<span class="badge">' + (statusLabels[job.status] || job.status) + '</span>' +
        '<div class="cust">' + escapeHtml(job.cust_name || "-") + '</div>' +
        '<div class="addr"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 6-9 12-9 12s-9-6-9-12a9 9 0 0 1 18 0Z"/><circle cx="12" cy="10" r="3"/></svg>' + escapeHtml(job.cust_address || "-") + '</div>' +
        (job.cod_amount ? '<div class="cod-line">เก็บเงินปลายทาง ' + job.cod_amount + ' บาท</div>' : '') +
        '<div class="actions">' + actionsHtml + '</div>' +
        '</div>';
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    // ---- job actions ----
    async function acceptJob(jobId) {
      const result = await callGas("acceptJob", { jobId, riderId: session.riderId });
      if (result.ok) loadJobs();
    }
    async function departJob(jobId) {
      const result = await callGas("depart", { jobId, riderId: session.riderId });
      if (result.ok) {
        if (window.RiderLocation) {
          RiderLocation.start(session.riderId, jobId, { supabaseUrl: SUPABASE_URL, supabaseKey: SUPABASE_ANON_KEY });
        }
        loadJobs();
      }
    }
    async function arriveJob(jobId) {
      const result = await callGas("arrive", { jobId, riderId: session.riderId });
      if (result.ok) loadJobs();
    }

    // ============================================================
    // HISTORY TAB
    // ============================================================
    async function loadHistory() {
      if (!session) return;
      const listEl = document.getElementById("historyList");
      const result = await callGas("myHistory", { riderId: session.riderId, limit: 50 });
      if (!result.ok || !Array.isArray(result.data)) {
        listEl.innerHTML = '<div class="empty-state">โหลดประวัติไม่สำเร็จ ลองรีเฟรชอีกครั้ง</div>';
        return;
      }
      renderHistory(result.data);
    }

    function renderHistory(rows) {
      const listEl = document.getElementById("historyList");
      if (!rows.length) {
        listEl.innerHTML = '<div class="empty-state">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/></svg>' +
          '<div>ยังไม่มีประวัติการส่งของ</div></div>';
        return;
      }
      listEl.innerHTML = rows.map(renderHistoryItem).join("");
    }

    function formatDate(iso) {
      if (!iso) return "-";
      const d = new Date(iso);
      if (isNaN(d)) return String(iso);
      return d.toLocaleDateString("th-TH", { day: "numeric", month: "short", year: "numeric" }) +
        " " + d.toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit" });
    }

    const failReasonLabels = {
      no_answer: "ลูกค้าไม่รับสาย", not_home: "ไม่อยู่บ้าน",
      refused: "ปฏิเสธรับของ", wrong_address: "ที่อยู่ผิด"
    };

    function renderHistoryItem(row) {
      const isDone = row.status === "done";
      return '<div class="history-item">' +
        '<div class="left">' +
          '<div class="cust">' + escapeHtml(row.cust_name || "-") + '</div>' +
          '<div class="addr">' + escapeHtml(row.cust_address || "-") + '</div>' +
          '<div class="date">' + formatDate(row.done_at) + '</div>' +
        '</div>' +
        '<div class="right">' +
          '<span class="status-pill ' + (isDone ? "done" : "failed") + '">' +
            (isDone ? "สำเร็จ" : (failReasonLabels[row.fail_reason] || "ไม่สำเร็จ")) +
          '</span>' +
          (isDone && row.cod_collected ? '<div class="cod">' + row.cod_collected + ' บาท</div>' : '') +
        '</div>' +
      '</div>';
    }

    // ============================================================
    // ACCOUNT TAB
    // ============================================================
    async function loadAccountStats() {
      if (!session) return;
      const result = await callGas("myCOD", { riderId: session.riderId });
      if (result.ok && result.data) {
        document.getElementById("codTotalLabel").textContent = Number(result.data.total || 0).toLocaleString("th-TH");
        document.getElementById("codCountLabel").textContent = result.data.count || 0;
      } else {
        document.getElementById("codTotalLabel").textContent = "–";
        document.getElementById("codCountLabel").textContent = "–";
      }
    }

    // ============================================================
    // COMPLETE / FAIL MODAL
    // ============================================================
    const modal = document.getElementById("completeModal");
    const photoInput = document.getElementById("photoInput");
    const photoPreview = document.getElementById("photoPreview");

    function openCompleteModal(jobId) {
      activeJobId = jobId;
      photoInput.value = "";
      photoPreview.style.display = "none";
      document.getElementById("codInput").value = "";
      selectedReason = null;
      document.querySelectorAll(".fail-reasons button").forEach(b => b.classList.remove("selected"));
      modal.classList.add("active");
    }

    document.getElementById("cancelModalBtn").addEventListener("click", () => {
      modal.classList.remove("active");
    });

    photoInput.addEventListener("change", () => {
      const file = photoInput.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => { photoPreview.src = reader.result; photoPreview.style.display = "block"; };
      reader.readAsDataURL(file);
    });

    document.querySelectorAll(".fail-reasons button").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".fail-reasons button").forEach(b => b.classList.remove("selected"));
        btn.classList.add("selected");
        selectedReason = btn.dataset.reason;
      });
    });

    document.getElementById("confirmCompleteBtn").addEventListener("click", async () => {
      const btn = document.getElementById("confirmCompleteBtn");
      btn.disabled = true; btn.textContent = "กำลังส่งข้อมูล...";

      let photoBase64 = null;
      if (photoInput.files[0]) photoBase64 = await fileToBase64(photoInput.files[0]);

      const codCollected = Number(document.getElementById("codInput").value) || 0;

      const result = await callGas("complete", {
        jobId: activeJobId, riderId: session.riderId, photoBase64, codCollected
      });

      btn.disabled = false; btn.textContent = "ยืนยันส่งสำเร็จ";

      if (result.ok) {
        if (window.RiderLocation) RiderLocation.stop();
        modal.classList.remove("active");
        loadJobs();
      } else {
        alert("ส่งข้อมูลไม่สำเร็จ ลองใหม่อีกครั้ง");
      }
    });

    document.getElementById("confirmFailBtn").addEventListener("click", async () => {
      if (!selectedReason) { alert("เลือกเหตุผลก่อน"); return; }
      const btn = document.getElementById("confirmFailBtn");
      btn.disabled = true; btn.textContent = "กำลังบันทึก...";

      const result = await callGas("failJob", {
        jobId: activeJobId, riderId: session.riderId, reason: selectedReason
      });

      btn.disabled = false; btn.textContent = "ยืนยันส่งไม่สำเร็จ";

      if (result.ok) {
        if (window.RiderLocation) RiderLocation.stop();
        modal.classList.remove("active");
        loadJobs();
      } else {
        alert("บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง");
      }
    });

    // ============================================================
    // BOOT
    // ============================================================
    debugLog("Monshin Rider — page loaded", GAS_ENDPOINT);
    if (loadSession()) enterApp();
  </script>
</body>
</html>
